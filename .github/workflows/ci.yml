name: CI

on:
    push:
        branches:
            - 'feature/**'
    pull_request:
        branches:
            - staging
            - master

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    node-quality:
        name: Node quality
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        defaults:
            run:
                working-directory: src

        steps:
            - name: Check out repository
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

            - name: Set up Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: 22.23.1
                  cache: npm
                  cache-dependency-path: src/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Check formatting
              run: npm run format:check

            - name: Check linting
              run: npm run lint:check

            - name: Run tests with coverage
              run: npm test -- --ci --coverage --runInBand

            - name: Audit production dependencies
              run: npm audit --omit=dev --audit-level=high

            - name: Upload coverage report
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: coverage-${{ github.sha }}
                  path: src/coverage/
                  if-no-files-found: error
                  retention-days: 7

    container-quality:
        name: Container quality
        needs: node-quality
        runs-on: ubuntu-24.04
        timeout-minutes: 25

        steps:
            - name: Check out repository
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

            - name: Lint Dockerfile
              uses: hadolint/hadolint-action@3fc49fb50d59c6ab7917a2e4195dba633e515b29 # v3.2.0
              with:
                  dockerfile: src/Dockerfile
                  failure-threshold: warning

            - name: Scan repository for secrets
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                  scan-type: fs
                  scan-ref: .
                  scanners: secret
                  format: table
                  exit-code: 1

            - name: Build container image
              run: docker build --pull --tag goldenowl-app:ci ./src

            - name: Scan image vulnerabilities
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                  scan-type: image
                  image-ref: goldenowl-app:ci
                  scanners: vuln
                  severity: HIGH,CRITICAL
                  ignore-unfixed: false
                  format: table
                  exit-code: 1

            - name: Generate SPDX JSON SBOM
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                  scan-type: image
                  image-ref: goldenowl-app:ci
                  scanners: vuln
                  format: spdx-json
                  output: sbom.spdx.json
                  exit-code: 0

            - name: Upload SBOM
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: sbom-${{ github.sha }}
                  path: sbom.spdx.json
                  if-no-files-found: error
                  retention-days: 7
