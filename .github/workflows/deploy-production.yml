name: Deploy production

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: goldenowl-app
  ECS_CLUSTER: goldenowl-production-cluster
  ECS_SERVICE: goldenowl-production-service
  ECS_TASK_FAMILY: goldenowl-production
  ECS_CONTAINER_NAME: app
  APPROVED_DIGEST_PARAMETER: /goldenowl/approved-image-digest

jobs:
  deploy:
    name: Verify and promote
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Validate production environment variables
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          test -n "$AWS_ROLE_ARN" || { echo "Missing production variable AWS_ROLE_ARN" >&2; exit 1; }
          test -n "$PRODUCTION_URL" || { echo "Missing production variable PRODUCTION_URL" >&2; exit 1; }

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: goldenowl-production-${{ github.run_id }}

      - name: Read approved image digest
        id: approved-image
        shell: bash
        run: |
          digest_ref=$(aws ssm get-parameter \
            --name "$APPROVED_DIGEST_PARAMETER" \
            --query 'Parameter.Value' \
            --output text)

          expected_pattern="^[0-9]{12}\\.dkr\\.ecr\\.${AWS_REGION}\\.amazonaws\\.com/${ECR_REPOSITORY}@sha256:[0-9a-f]{64}$"
          if [[ ! "$digest_ref" =~ $expected_pattern ]]; then
            echo "Approved image is not a valid immutable ${ECR_REPOSITORY} digest reference." >&2
            exit 1
          fi

          echo "digest_ref=$digest_ref" >> "$GITHUB_OUTPUT"
          echo "digest=${digest_ref##*@}" >> "$GITHUB_OUTPUT"

      - name: Verify approved digest exists in ECR
        env:
          DIGEST: ${{ steps.approved-image.outputs.digest }}
        run: |
          resolved_digest=$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageDigest="$DIGEST" \
            --query 'imageDetails[0].imageDigest' \
            --output text)
          test "$resolved_digest" = "$DIGEST"

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify staging signature
        env:
          DIGEST_REF: ${{ steps.approved-image.outputs.digest_ref }}
        run: |
          cosign verify \
            --certificate-identity-regexp '^https://github.com/harrybrwnie/goldenowl-devops-internship-challenge/.github/workflows/deploy-staging.yml@refs/heads/staging$' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "$DIGEST_REF"

      - name: Download current production task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_FAMILY" \
            --query taskDefinition \
            > task-definition.json

      - name: Render task definition with approved digest
        id: render-task
        uses: aws-actions/amazon-ecs-render-task-definition@138c24f321fdbdf7edee4a685519d253cae2cdea # v1.9.0
        with:
          task-definition: task-definition.json
          container-name: ${{ env.ECS_CONTAINER_NAME }}
          image: ${{ steps.approved-image.outputs.digest_ref }}

      - name: Deploy task definition to production
        uses: aws-actions/amazon-ecs-deploy-task-definition@c465972ecbd160473f22e683363b422a5412a3de # v2.6.3
        with:
          task-definition: ${{ steps.render-task.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Smoke test production
        run: ./scripts/smoke-test.sh "${{ vars.PRODUCTION_URL }}"

      - name: Write deployment summary
        env:
          DIGEST_REF: ${{ steps.approved-image.outputs.digest_ref }}
        run: |
          {
            echo "## Production promotion"
            echo
            echo "- Approved image: \`$DIGEST_REF\`"
            echo "- Endpoint: ${{ vars.PRODUCTION_URL }}"
            echo "- Source parameter: \`$APPROVED_DIGEST_PARAMETER\`"
          } >> "$GITHUB_STEP_SUMMARY"
